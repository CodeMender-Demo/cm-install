name: Install CodeMender
description: Downloads the CodeMender CLI and installs it in the runner

inputs:
  workload_identity_provider:
    description: The full identifier of the GCP Workload Identity Provider
    required: true
  service_account:
    description: The GCP service account email to impersonate
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "${{ inputs.workload_identity_provider }}"
        service_account: "${{ inputs.service_account }}"

    # Set up the gcloud CLI
    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Check for existing installation and install
      shell: bash
      run: |
        if ! command -v cm &> /dev/null; then
            echo "CodeMender not found, installing..."
            echo "Downloading CodeMender CLI..."
            curl -L -o cm-linux-amd64.zip "https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm%3Astable%3Acm-linux-amd64.zip:download?alt=media"
            unzip cm-linux-amd64.zip
            chmod +x cm
            mv cm /usr/local/bin/cm
            cm init
            rm cm-linux-amd64.zip
        else
            # Command exists, now it's safe to check the version
            CM_VERSION=$(cm --version)
            echo "CodeMender already installed. Version: $CM_VERSION"
        fi
